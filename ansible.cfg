[defaults]
inventory = inventory.ini
local_tmp = /tmp/bhyve-ansible-local
interpreter_python = /usr/bin/python3
retry_files_enabled = False
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/tmp/bhyve-ansible-%C -o UserKnownHostsFile=/tmp/bhyve_automat_known_hosts
